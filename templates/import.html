{% extends "base.html" %}
{% block content %}
  <h1>Import Transactions CSV</h1>
  {% if message %}<p>{{ message }}</p>{% endif %}
  <form enctype="multipart/form-data" method="post">
    <input type="file" name="file" accept=".csv" required>
    <button type="submit">Upload</button>
  </form>
{% endblock %}
