{% extends "base.html" %}
{% block content %}
<h2>Snapshot History</h2>
<table class="sortable">
  <thead>
    <tr>
      <th>Date</th>
      <th>Total Value (USD)</th>
    </tr>
  </thead>
  <tbody>
    {% for snap in snapshots %}
    <tr>
      <td>{{ snap.date }}</td>
      <td>${{ "%.2f"|format(snap.total_value) }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
